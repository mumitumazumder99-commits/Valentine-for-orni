<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orni 💖 Be My Valentine</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to right, #ffafbd, #ffc3a0);
    font-family: 'Comic Sans MS', cursive;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    z-index: 2;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
}

h1 {
    color: #ff4d6d;
}

.images img {
    width: 90px;
    margin: 10px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
}

#yesBtn {
    background: #ff4d6d;
    color: white;
    transition: transform 0.3s;
}

#noBtn {
    background: gray;
    color: white;
}

#message {
    font-size: 24px;
    margin-top: 20px;
    color: #ff4d6d;
}

/* Floating hearts */
.hearts span {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="music" loop>
    <source src="music/love.mp3" type="audio/mpeg">
</audio>

<div class="hearts"></div>

<div class="container" onclick="playMusic()">
    <h1>💘 Orni, Will You Be My Valentine? 💘</h1>

    <div class="images">
        <img src="images/heart.png">
        <img src="images/teddy.png">
        <img src="images/roses.png">
    </div>

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">YES 💖</button>
        <button id="noBtn" onclick="sayNo()">NO 😢</button>
    </div>

    <p id="message"></p>
</div>

<script>
let yesSize = 1;
let musicStarted = false;

// iPhone-safe music play
function playMusic() {
    if (!musicStarted) {
        document.getElementById("music").play();
        musicStarted = true;
    }
}

// NO button logic
function sayNo() {
    playMusic();
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    noBtn.innerText = "Are you sure? 😏";
    yesSize += 0.3;
    yesBtn.style.transform = `scale(${yesSize})`;
}

// YES button logic
function sayYes() {
    playMusic();
    document.querySelector(".buttons").style.display = "none";
    document.getElementById("message").innerHTML =
        "💖 YAY ORNI!!! 💖<br>You are officially my Valentine 😍💘";
}

// Floating hearts
const heartsContainer = document.querySelector(".hearts");

setInterval(() => {
    const heart = document.createElement("span");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    heartsContainer.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 300);
</script>

</body>
</html>
